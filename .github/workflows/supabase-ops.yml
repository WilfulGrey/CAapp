name: Supabase Manual Ops

# Manuelle Operationen gegen Supabase (Migrations + Function-Invoke),
# die wir sonst per `supabase db push` / `curl` lokal machen müssten.
# Auth via SUPABASE_ACCESS_TOKEN (GitHub Secret, gleiches Token wie
# der Edge-Function-Deploy-Job benutzt).

on:
  workflow_dispatch:
    inputs:
      apply_daily_report_migration:
        description: "Apply the daily-analytics-report pg_cron migration?"
        type: boolean
        default: false
      invoke_function:
        description: "Edge function name to invoke (leer = skip)"
        type: string
        default: ""
      run_query:
        description: "Arbitrary SQL query to run via Management API (leer = skip)"
        type: string
        default: ""
      resend_last_applications_count:
        description: "Resend last N application_received mails to BCC only (leer = skip)"
        type: string
        default: ""
      deploy_caapp_function:
        description: "CAapp Edge Function auf PROD deployen (Name, z.B. send-scheduled-emails; leer = skip)"
        type: string
        default: ""
      deploy_kostenrechner_function:
        description: "kostenrechner Edge Function auf PROD deployen (Name, z.B. send-scheduled-emails; leer = skip)"
        type: string
        default: ""

jobs:
  ops:
    name: Supabase Ops
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ycdwtrklpoqprabtwahi
    steps:
      - uses: actions/checkout@v4

      - name: Fetch anon api key (for function invoke)
        id: keys
        run: |
          ANON_KEY=$(curl -fsS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            | jq -r '.[] | select(.name == "anon") | .api_key')
          if [ -z "$ANON_KEY" ] || [ "$ANON_KEY" = "null" ]; then
            echo "::error::Could not fetch anon key from Management API"
            exit 1
          fi
          # Mask the key in logs and pass to subsequent steps
          echo "::add-mask::$ANON_KEY"
          echo "anon_key=$ANON_KEY" >> $GITHUB_OUTPUT

      - name: Apply daily-analytics-report migration
        if: github.event.inputs.apply_daily_report_migration == 'true'
        run: |
          MIGRATION_FILE="supabase/migrations/20260520070000_setup_daily_analytics_report_cron.sql"
          if [ ! -f "$MIGRATION_FILE" ]; then
            echo "::error::Migration file not found: $MIGRATION_FILE"
            exit 1
          fi

          echo "::group::Applying $MIGRATION_FILE via Management API"
          SQL_CONTENT=$(cat "$MIGRATION_FILE")
          PAYLOAD=$(jq -n --arg q "$SQL_CONTENT" '{query: $q}')

          HTTP_CODE=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$PAYLOAD")

          echo "HTTP $HTTP_CODE"
          cat /tmp/response.json | jq . 2>/dev/null || cat /tmp/response.json
          echo "::endgroup::"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Migration failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Run arbitrary SQL query
        if: github.event.inputs.run_query != ''
        run: |
          echo "::group::Running query via Management API"
          PAYLOAD=$(jq -n --arg q "${{ github.event.inputs.run_query }}" '{query: $q}')
          HTTP_CODE=$(curl -sS -o /tmp/query-response.json -w "%{http_code}" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$PAYLOAD")
          echo "HTTP $HTTP_CODE"
          cat /tmp/query-response.json | jq . 2>/dev/null || cat /tmp/query-response.json
          echo "::endgroup::"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Query failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Invoke edge function
        if: github.event.inputs.invoke_function != ''
        env:
          ANON_KEY: ${{ steps.keys.outputs.anon_key }}
        run: |
          FN="${{ github.event.inputs.invoke_function }}"
          URL="https://$PROJECT_REF.supabase.co/functions/v1/$FN"
          echo "::group::Invoking $FN"
          HTTP_CODE=$(curl -sS -o /tmp/fn-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$URL")
          echo "HTTP $HTTP_CODE"
          cat /tmp/fn-response.json | jq . 2>/dev/null || cat /tmp/fn-response.json
          echo "::endgroup::"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Function invoke failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Resend last N application_received mails to BCC
        if: github.event.inputs.resend_last_applications_count != ''
        run: |
          # Bearer-Auth gegen den Service-Role-Key — gleicher Key, den der
          # Next.js-Server kennt. Wir ziehen ihn aus der Management API.
          SERVICE_KEY=$(curl -fsS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          if [ -z "$SERVICE_KEY" ] || [ "$SERVICE_KEY" = "null" ]; then
            echo "::error::Could not fetch service_role key from Management API"
            exit 1
          fi
          echo "::add-mask::$SERVICE_KEY"

          N="${{ github.event.inputs.resend_last_applications_count }}"
          URL="https://kostenrechner.primundus.de/api/admin/resend-bewerbung-bcc"
          echo "::group::Resending last $N application_received mails to BCC"
          HTTP_CODE=$(curl -sS -o /tmp/resend-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"limit\": $N}" \
            "$URL")
          echo "HTTP $HTTP_CODE"
          cat /tmp/resend-response.json | jq . 2>/dev/null || cat /tmp/resend-response.json
          echo "::endgroup::"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Resend failed with HTTP $HTTP_CODE"
            exit 1
          fi

      # ─── Edge Function PROD-Deploys (manuelle Promotion) ────────────────
      # Staging deployt automatisch via test.yml beim Push auf integration.
      # PROD-Deploy ist bewusst manuell hier eingewählt, damit Änderungen
      # an Edge Functions erst nach Staging-Verifikation auf den echten
      # Customer-Projekt landen.
      - name: Setup Supabase CLI
        if: github.event.inputs.deploy_caapp_function != '' || github.event.inputs.deploy_kostenrechner_function != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy CAapp edge function to PROD
        if: github.event.inputs.deploy_caapp_function != ''
        run: |
          FN="${{ github.event.inputs.deploy_caapp_function }}"
          if [ ! -d "supabase/functions/$FN" ]; then
            echo "::error::CAapp function not found: supabase/functions/$FN"
            exit 1
          fi
          echo "::group::Deploying $FN → PROD ($PROJECT_REF)"
          supabase functions deploy "$FN" --project-ref "$PROJECT_REF"
          echo "::endgroup::"

      - name: Deploy kostenrechner edge function to PROD
        if: github.event.inputs.deploy_kostenrechner_function != ''
        run: |
          FN="${{ github.event.inputs.deploy_kostenrechner_function }}"
          if [ ! -d "project 3/supabase/functions/$FN" ]; then
            echo "::error::kostenrechner function not found: project 3/supabase/functions/$FN"
            exit 1
          fi
          # Katalog "project 3" hat ein Leerzeichen → bricht docker volume
          # mount in der Supabase-CLI ("entrypoint path does not exist").
          # Workaround analog zu test.yml: nach /tmp kopieren ohne Spaces.
          rm -rf /tmp/kr-deploy
          mkdir -p /tmp/kr-deploy/supabase
          cp -r "project 3/supabase/functions" /tmp/kr-deploy/supabase/
          cd /tmp/kr-deploy
          echo "::group::Deploying $FN → PROD ($PROJECT_REF)"
          supabase functions deploy "$FN" --project-ref "$PROJECT_REF"
          echo "::endgroup::"
