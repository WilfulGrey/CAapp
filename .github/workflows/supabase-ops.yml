name: Supabase Manual Ops

# Manuelle Operationen gegen Supabase (Migrations + Function-Invoke),
# die wir sonst per `supabase db push` / `curl` lokal machen müssten.
# Auth via SUPABASE_ACCESS_TOKEN (GitHub Secret, gleiches Token wie
# der Edge-Function-Deploy-Job benutzt).

on:
  workflow_dispatch:
    inputs:
      apply_daily_report_migration:
        description: "Apply the daily-analytics-report pg_cron migration?"
        type: boolean
        default: false
      invoke_function:
        description: "Edge function name to invoke (leer = skip)"
        type: string
        default: ""

jobs:
  ops:
    name: Supabase Ops
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ycdwtrklpoqprabtwahi
    steps:
      - uses: actions/checkout@v4

      - name: Fetch anon api key (for function invoke)
        id: keys
        run: |
          ANON_KEY=$(curl -fsS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            | jq -r '.[] | select(.name == "anon") | .api_key')
          if [ -z "$ANON_KEY" ] || [ "$ANON_KEY" = "null" ]; then
            echo "::error::Could not fetch anon key from Management API"
            exit 1
          fi
          # Mask the key in logs and pass to subsequent steps
          echo "::add-mask::$ANON_KEY"
          echo "anon_key=$ANON_KEY" >> $GITHUB_OUTPUT

      - name: Apply daily-analytics-report migration
        if: github.event.inputs.apply_daily_report_migration == 'true'
        run: |
          MIGRATION_FILE="supabase/migrations/20260520070000_setup_daily_analytics_report_cron.sql"
          if [ ! -f "$MIGRATION_FILE" ]; then
            echo "::error::Migration file not found: $MIGRATION_FILE"
            exit 1
          fi

          echo "::group::Applying $MIGRATION_FILE via Management API"
          SQL_CONTENT=$(cat "$MIGRATION_FILE")
          PAYLOAD=$(jq -n --arg q "$SQL_CONTENT" '{query: $q}')

          HTTP_CODE=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$PAYLOAD")

          echo "HTTP $HTTP_CODE"
          cat /tmp/response.json | jq . 2>/dev/null || cat /tmp/response.json
          echo "::endgroup::"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Migration failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Invoke edge function
        if: github.event.inputs.invoke_function != ''
        env:
          ANON_KEY: ${{ steps.keys.outputs.anon_key }}
        run: |
          FN="${{ github.event.inputs.invoke_function }}"
          URL="https://$PROJECT_REF.supabase.co/functions/v1/$FN"
          echo "::group::Invoking $FN"
          HTTP_CODE=$(curl -sS -o /tmp/fn-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$URL")
          echo "HTTP $HTTP_CODE"
          cat /tmp/fn-response.json | jq . 2>/dev/null || cat /tmp/fn-response.json
          echo "::endgroup::"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Function invoke failed with HTTP $HTTP_CODE"
            exit 1
          fi
