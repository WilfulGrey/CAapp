name: Tests

on:
  pull_request:
    branches: [integration/mamamia-onboarding, main]
  push:
    branches: [integration/mamamia-onboarding]
  # Manual trigger — deploys Edge Functions regardless of diff. Useful to
  # ship a function whose code is already merged but not yet deployed.
  workflow_dispatch:

jobs:
  # ─── Frontend (CAapp Vite) ─────────────────────────────────────────────
  vitest:
    name: vitest (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      # Pin timezone to Europe/Berlin — `formatDate('YYYY-12-31T23:59:59Z')`
      # rolls into next year only when local TZ is UTC+. Beta + prod serve
      # German customers, so pinning Berlin matches actual user behaviour.
      - name: Run vitest
        run: npx vitest run
        env:
          TZ: Europe/Berlin

      # TypeScript check (build config skips test files)
      - name: Typecheck (src/)
        run: npx tsc --noEmit -p tsconfig.build.json

  # ─── Edge Functions (Deno) ─────────────────────────────────────────────
  deno-onboard:
    name: deno tests (onboard-to-mamamia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"

      - name: Run onboard tests
        working-directory: supabase/functions/onboard-to-mamamia
        run: deno task test

  deno-proxy:
    name: deno tests (mamamia-proxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"

      - name: Run proxy tests
        working-directory: supabase/functions/mamamia-proxy
        run: deno task test

  deno-detect:
    name: deno tests (detect-caregiver-events)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"

      - name: Run detect tests
        working-directory: supabase/functions/detect-caregiver-events
        run: deno task test

  # ─── Apply DB migrations to STAGING (schema before code) ──────────────
  # Bisher liefen Migrationen nur manuell auf PROD (run_query, prod-only);
  # Staging driftete, sobald eine edge-fn eine neue Spalte nutzte (Invite-Bug
  # Kunde 7761: caregiver_invite_attempts.mamamia_job_offer_id fehlte). Dieser
  # Job zieht ausstehende Migrationen auf Staging BEVOR die Funktionen deployen.
  # scripts/apply-migrations.sh nutzt das vorhandene SUPABASE_ACCESS_TOKEN
  # (kein neues Secret) und ist idempotent (schema_migrations-Tracking).
  migrate-staging:
    name: Apply migrations to Supabase (staging)
    needs: [vitest, deno-onboard, deno-proxy, deno-detect]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/integration/mamamia-onboarding') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending migrations → STAGING
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_REF: ${{ secrets.SUPABASE_STAGING_REF }}
        run: |
          if [ -z "$STAGING_REF" ]; then
            echo "::error::SUPABASE_STAGING_REF secret not set — cannot migrate staging."
            exit 1
          fi
          chmod +x scripts/apply-migrations.sh
          ./scripts/apply-migrations.sh "$STAGING_REF"

  # ─── Deploy CA-App Edge Functions to STAGING Supabase ─────────────────
  # Push to integration/mamamia-onboarding (= trunk) → deploys edge fns to
  # STAGING Supabase project (taggpiwpwthgpcmaiqjw via SUPABASE_STAGING_REF).
  # PROD edge fn deploy is gated — only via `/deploy_prod` Claude skill
  # (manual promotion after staging verification).
  #
  # Strukturalnie eliminuje race condition gdzie ktoś deployuje ze swojego
  # lokalnego stanu i nadpisuje cudze zmiany w chmurze. Po merge PR-a CI
  # robi single source of truth deploy z git HEAD na staging.
  #
  # Wymaga GitHub Secrets:
  #   SUPABASE_ACCESS_TOKEN  — user-scoped token, works for both staging+prod
  #   SUPABASE_STAGING_REF   — staging project ref (taggpiwpwthgpcmaiqjw)
  deploy-edge-functions:
    name: Deploy CA-App Edge Functions to Supabase (staging)
    needs: [migrate-staging]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/integration/mamamia-onboarding') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # need previous commit for diff check below
          fetch-depth: 2

      - name: Check if CA-App Edge Functions changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — deploying regardless of diff."
            echo "skip=false" >> $GITHUB_OUTPUT
          elif git diff --quiet ${{ github.event.before }} ${{ github.sha }} -- supabase/functions/; then
            echo "CA-App Edge Functions unchanged in this push — skipping deploy."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "CA-App Edge Functions changed — proceeding with deploy."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: supabase/setup-cli@v1
        if: steps.changed.outputs.skip != 'true'
        with:
          version: latest

      # Tylko funkcje istniejące w repo-root supabase/functions/.
      - name: Deploy functions to STAGING
        if: steps.changed.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_REF: ${{ secrets.SUPABASE_STAGING_REF }}
        run: |
          if [ -z "$STAGING_REF" ]; then
            echo "::error::SUPABASE_STAGING_REF secret not set — cannot deploy edge fns to staging."
            exit 1
          fi
          for fn in mamamia-proxy onboard-to-mamamia detect-caregiver-events daily-analytics-report sync-acceptance; do
            echo "::group::Deploying $fn → staging ($STAGING_REF)"
            supabase functions deploy "$fn" --project-ref "$STAGING_REF"
            echo "::endgroup::"
          done

  # ─── Deploy kostenrechner Edge Functions to STAGING (project 3/) ────────
  # Funkcje kostenrechnera leżą w `project 3/supabase/functions/` — ten sam
  # Supabase project co CA-App (monorepo, w staging = taggpiwpwthgpcmaiqjw),
  # ale `supabase functions deploy` szuka funkcji względem cwd. Dlatego
  # osobny job z working-directory "project 3" + własny diff-trigger.
  deploy-kostenrechner-edge-functions:
    name: Deploy kostenrechner Edge Functions to Supabase (staging)
    needs: [migrate-staging]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/integration/mamamia-onboarding') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if kostenrechner Edge Functions changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — deploying regardless of diff."
            echo "skip=false" >> $GITHUB_OUTPUT
          elif git diff --quiet ${{ github.event.before }} ${{ github.sha }} -- 'project 3/supabase/functions/'; then
            echo "kostenrechner Edge Functions unchanged — skipping deploy."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "kostenrechner Edge Functions changed — proceeding with deploy."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: supabase/setup-cli@v1
        if: steps.changed.outputs.skip != 'true'
        with:
          version: latest

      - name: Deploy kostenrechner functions to STAGING
        if: steps.changed.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_REF: ${{ secrets.SUPABASE_STAGING_REF }}
        run: |
          if [ -z "$STAGING_REF" ]; then
            echo "::error::SUPABASE_STAGING_REF secret not set — cannot deploy edge fns to staging."
            exit 1
          fi
          # Katalog "project 3" ma spację w nazwie — psuje to docker volume
          # mount w supabase CLI ("entrypoint path does not exist"). Kopiujemy
          # funkcje do ścieżki bez spacji i deployujemy stamtąd. Funkcje
          # kostenrechnera są samodzielne (brak _shared), więc kopia wystarcza.
          rm -rf /tmp/kr-deploy
          mkdir -p /tmp/kr-deploy/supabase
          cp -r "project 3/supabase/functions" /tmp/kr-deploy/supabase/
          cd /tmp/kr-deploy
          for fn in chat-ai schedule-email send-scheduled-emails; do
            echo "::group::Deploying $fn → staging ($STAGING_REF)"
            supabase functions deploy "$fn" --project-ref "$STAGING_REF"
            echo "::endgroup::"
          done
